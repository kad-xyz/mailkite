<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="mailkite">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#sky)"/>
  <!-- string / tail -->
  <path d="M70 98 C 62 106, 80 110, 72 118 S 66 124, 74 128" fill="none" stroke="#FDE68A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M68 105 l-8 -1" stroke="#FDE68A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M76 113 l8 0" stroke="#FDE68A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- kite, tilted, made of an envelope -->
  <g transform="rotate(-12 64 56)">
    <rect x="30" y="30" width="68" height="50" rx="7" fill="#FFFFFF"/>
    <path d="M33 34 L64 58 L95 34" fill="none" stroke="#6366F1" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M30 80 L64 102 L98 80 Z" fill="#E0E7FF"/>
  </g>
</svg>
